<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Dua Dimensi</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f4f6f8; }
    header { background: #1f4e79; color: #fff; padding: 12px 20px; }
    header h1 { margin: 0; font-size: 1.2rem; }
    nav { display: flex; gap: 8px; padding: 10px 20px; background: #fff; border-bottom: 1px solid #ddd; flex-wrap: wrap; }
    nav button { padding: 8px 14px; border: 1px solid #1f4e79; background: #fff; color: #1f4e79; border-radius: 6px; cursor: pointer; }
    nav button.active { background: #1f4e79; color: #fff; }
    .open { margin-left: auto; align-self: center; font-size: 0.9rem; }
    iframe { width: 100%; height: calc(100vh - 110px); border: 0; background: #fff; }
  </style>
</head>
<body>
  <header><h1>Dua Dimensi – Aplikasi</h1></header>
  <nav>
    <button class="active" data-target="siswa">Siswa</button>
    <button data-target="pengajar">Pengajar</button>
    <a class="open" id="openNew" target="_blank" rel="noopener">Buka di tab baru ↗</a>
  </nav>

  <iframe id="frame" title="Aplikasi"></iframe>

  <script>
    const APPS = {
      siswa: "https://script.google.com/macros/s/AKfycbyp9zjnOvYOpr6vc7-o9yZUixk7JL3omrDBgI4uURmGpKDtijjm1b4Yd5_9JwsPSuc9nw/exec",
      pengajar: "https://script.google.com/macros/s/AKfycbyF0c6cR8FjZ6ljReW_H0kWl6jvkF_tXIhnQ99eYoKEYHPLhfrZ2ZKNfNlg2KooAOnNZA/exec"
    };

    const frame = document.getElementById("frame");
    const openNew = document.getElementById("openNew");
    const buttons = document.querySelectorAll("nav button");

    function show(key) {
      frame.src = APPS[key];
      openNew.href = APPS[key];
      buttons.forEach(b => b.classList.toggle("active", b.dataset.target === key));
      history.replaceState(null, "", "#" + key);
    }

    buttons.forEach(b => b.addEventListener("click", () => show(b.dataset.target)));

    const start = location.hash.replace("#", "");
    show(APPS[start] ? start : "siswa");
  </script>
</body>
</html>
